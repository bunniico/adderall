services:
  adderall:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data   # the SQLite file lives here; nothing is ever lost
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Only needed for identity-linked keys; can also be set in ⚙ Settings.
      - ANTHROPIC_WORKSPACE_ID=${ANTHROPIC_WORKSPACE_ID:-}
    restart: unless-stopped
